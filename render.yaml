services:
  - type: web
    name: typhoon-animation-api
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 1800 api_server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
